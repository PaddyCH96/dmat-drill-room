<div class="wrap">
<header class="top">
  <div class="toprow">
    <div class="brand"><h1>dMAT Drill Room</h1><span class="muted" data-i18n="tagline">Core + General Academic Module</span></div>
    <div class="row noprint" style="gap:14px">
      <div class="skins" role="group" aria-label="Theme" data-i18n-aria="theme"><span data-i18n="theme">Theme</span>
        <button class="skin" data-skin="auto" title="Clean (follows your system light/dark setting)" data-i18n-title="theme.auto.title"><i style="background:linear-gradient(135deg,#FFFFFF 50%,#2F5BD3 50%)"></i><b data-i18n="theme.auto">Clean</b></button>
        <button class="skin" data-skin="warm" title="Warm" data-i18n-title="theme.warm.title"><i style="background:linear-gradient(135deg,#FAF6EF 50%,#B4531F 50%)"></i><b data-i18n="theme.warm">Warm</b></button>
        <button class="skin" data-skin="forest" title="Forest" data-i18n-title="theme.forest.title"><i style="background:linear-gradient(135deg,#F2F6F3 50%,#1F7A55 50%)"></i><b data-i18n="theme.forest">Forest</b></button>
        <button class="skin" data-skin="night" title="Night" data-i18n-title="theme.night.title"><i style="background:linear-gradient(135deg,#131A26 50%,#F5B84A 50%)"></i><b data-i18n="theme.night">Night</b></button>
      </div>
      <div class="skins lang" role="group" aria-label="Language" data-i18n-aria="language"><span data-i18n="language">Language</span>
        <button class="skin langbtn" data-lang="en" title="English"><i style="background:linear-gradient(135deg,#012169 50%,#C8102E 50%)"></i><b>EN</b></button>
        <button class="skin langbtn" data-lang="de" title="Deutsch"><i style="background:linear-gradient(135deg,#000000 50%,#DD0000 50%)"></i><b>DE</b></button>
      </div>
    </div>
  </div>
  <div class="row" style="gap:6px 14px;margin-top:6px"><div class="count" id="countdown"></div><span id="syncstate" class="count noprint" style="color:var(--faint)" data-i18n="sync.local">Progress saved in this browser</span></div>
  <nav class="tabs noprint" role="tablist" id="tabs" aria-label="Sections">
    <button role="tab" data-tab="today" aria-selected="true" data-i18n="tab.today">Today</button>
    <button role="tab" data-tab="plan" aria-selected="false" data-i18n="tab.plan">Study plan</button>
    <button role="tab" data-tab="practice" aria-selected="false" data-i18n="tab.practice">Practice</button>
    <button role="tab" data-tab="mock" aria-selected="false" data-i18n="tab.mock">Mock exam</button>
    <button role="tab" data-tab="progress" aria-selected="false" data-i18n="tab.progress">Progress</button>
    <button role="tab" data-tab="tricks" aria-selected="false" data-i18n="tab.tricks">Trick cards</button>
    <button role="tab" data-tab="guide" aria-selected="false" data-i18n="tab.guide">Tactics &amp; resources</button>
    <button role="tab" data-tab="setup" aria-selected="false" data-i18n="tab.setup">⚙ Settings</button>
  </nav>
</header>
<div id="announce" class="sr" role="status" aria-live="polite"></div>
<main id="view" tabindex="-1"></main>
<div id="appbar" role="status" aria-live="polite"></div>
