<meta charset="utf-8">
<title>dMAT Drill Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free, open-source practice app for the dMAT (digital Master Test): timed core-module generators, subject-module tests, mock exams, a mistake bank, trick cards and a study plan built around your exam date.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#F6F7F9; --surface:#FFFFFF; --sunk:#F0F2F5; --ink:#111827; --muted:#4B5563; --faint:#6B7280; --line:#E3E6EB;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#EAF0FD;
  --good:#15803D; --good-soft:#E7F6EC; --bad:#C2352B; --bad-soft:#FCEBEA; --warn:#A16207; --warn-soft:#FDF3DC;
  --grid:#9CA3AF; --cell:#FFFFFF; --shadow:0 1px 2px rgba(17,24,39,.05),0 2px 8px rgba(17,24,39,.04);
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:var(--body);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1116; --surface:#171B22; --sunk:#1F242D; --ink:#EEF1F5; --muted:#B4BCC8; --faint:#8C95A3; --line:#2A303A;
  --accent:#7EA2FF; --accent-ink:#0B1530; --accent-soft:#1C2742;
  --good:#5FD08A; --good-soft:#14301F; --bad:#FF8A80; --bad-soft:#3A1D1B; --warn:#F2C45A; --warn-soft:#3A2F14;
  --grid:#6B7280; --cell:#EEF1F5; --shadow:none;
}}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#171B22; --sunk:#1F242D; --ink:#EEF1F5; --muted:#B4BCC8; --faint:#8C95A3; --line:#2A303A;
  --accent:#7EA2FF; --accent-ink:#0B1530; --accent-soft:#1C2742;
  --good:#5FD08A; --good-soft:#14301F; --bad:#FF8A80; --bad-soft:#3A1D1B; --warn:#F2C45A; --warn-soft:#3A2F14;
  --grid:#6B7280; --cell:#EEF1F5; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;padding-inline:16px;padding-block:0 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25;font-weight:700}
h1{font-size:21px;letter-spacing:-.01em}
h2{font-size:24px;letter-spacing:-.01em}
h3{font-size:17.5px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:14px;color:var(--faint);font-weight:400}
header.top{padding-block:16px 12px;margin-bottom:24px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .muted{font-size:14px;color:var(--faint)}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--accent);font-weight:700}
nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;padding:4px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);width:max-content;max-width:100%}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:9px;color:var(--muted);white-space:nowrap;font-size:15.5px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
@media (max-width:560px){.panel{padding:18px}}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:700;font-size:15.5px;min-height:44px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.big{padding:14px 28px;font-size:17px;min-height:52px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;gap:8px;background:none;border:0}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;color:var(--muted);font-size:15px}
.seg button:hover{border-color:var(--faint);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.label{font-size:14px;font-weight:700;color:var(--ink);min-width:88px}
.step{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);font-weight:700}
.step i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pick{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--faint)}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick .meta{font-size:14px;color:var(--faint)}
.pick .muted{font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
/* session */
.sessbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:-24px -24px 18px;padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
@media (max-width:560px){.sessbar{margin:-18px -18px 16px;padding:12px 18px}}
.timer{font-family:var(--mono);font-size:22px;font-weight:700;padding:6px 14px;border-radius:10px;background:var(--sunk)}
.timer.warn{background:var(--warn-soft);color:var(--warn)} .timer.crit{background:var(--bad-soft);color:var(--bad)}
.navstrip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.navstrip button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12.5px;padding:0;color:var(--muted)}
.navstrip button.done{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.navstrip button.cur{border:2px solid var(--accent);color:var(--ink);font-weight:700}
.navstrip button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.navstrip button.ok{background:var(--good-soft);border-color:transparent;color:var(--good)} .navstrip button.no{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.noteban{font-size:14px;color:var(--faint)}
/* latin */
.ls{border-collapse:collapse;font-family:var(--mono);font-size:22px;font-weight:700;margin:4px 0}
.ls td,.ls th{width:52px;height:52px;text-align:center;border:1.5px solid var(--grid)}
.ls th{border:0;font-size:13px;color:var(--faint);font-weight:500;width:auto;height:auto;padding:4px 6px}
.ls td.q{background:var(--warn-soft);color:var(--warn)}
.ls td.fill{color:var(--accent)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-width:58px;height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:20px;font-weight:700}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* equations */
.eqs{font-family:var(--mono);font-size:23px;display:flex;flex-direction:column;gap:8px;padding:18px 24px;background:var(--sunk);border-radius:12px;width:max-content;max-width:100%}
.ansrow{display:flex;gap:16px;flex-wrap:wrap}
.ansrow label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:21px;font-weight:700}
.ansrow input{width:78px;height:50px;font:inherit;font-size:21px;text-align:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.ansrow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ansrow input.right{border-color:var(--good);background:var(--good-soft)} .ansrow input.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* figures */
.figrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.frame{display:flex;flex-direction:column;align-items:center;gap:4px}
.frame svg,.figopt svg{width:112px;height:112px;display:block}
.qslot{width:112px;height:112px;border:2px dashed var(--grid);border-radius:8px;display:grid;place-items:center;font-size:34px;color:var(--faint)}
.figcols{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px}
.figcol{display:flex;flex-direction:column;gap:8px;align-items:center}
.figopt{border:2.5px solid transparent;border-radius:10px;padding:4px;background:none}
.figopt:hover{border-color:var(--line)}
.figopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.figopt.right{border-color:var(--good);background:var(--good-soft)} .figopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.scroll-x{overflow-x:auto}
/* subject */
.subj{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.subj{grid-template-columns:1fr}}
.passage{max-height:68vh;overflow:auto;padding:4px 10px 4px 0;display:flex;flex-direction:column;gap:12px;max-width:66ch;font-size:17px;line-height:1.7}
.passage table{border-collapse:collapse;font-size:15px}
.passage td,.passage th{border:1px solid var(--line);padding:5px 10px;text-align:center}
.passage th{background:var(--sunk)}
.passage>*{flex-shrink:0}
.passage svg{width:100%;max-width:380px;height:auto;display:block}
.passage ul{margin:0;padding-left:20px}
.qtext{font-size:18px;font-weight:700;line-height:1.5}
.mcq{display:flex;flex-direction:column;gap:10px}
.mcq button{text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:13px 16px;display:flex;gap:12px;align-items:baseline;font-size:16.5px;min-height:52px}
.mcq button:hover{border-color:var(--accent)}
.mcq button .l{font-family:var(--mono);font-weight:700;color:var(--faint)}
.mcq button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mcq button.right{border-color:var(--good);background:var(--good-soft)} .mcq button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{background:var(--sunk);border-radius:12px;padding:14px 18px;font-size:15.5px;line-height:1.6}
.explain ol,.explain ul{margin:6px 0 0;padding-left:20px}
.trick{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.trick b{color:var(--accent)}
/* results */
.big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpis{display:flex;gap:28px;flex-wrap:wrap}
.review{display:flex;flex-direction:column;gap:6px}
.reviewitem{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:10px}
.reviewitem summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* plan */
.day{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:18px;align-items:start;padding:18px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .date{font-size:14px;color:var(--faint);line-height:1.3}
.day .date b{display:block;font-size:20px;color:var(--ink)}
.day.today{background:var(--accent-soft);margin-inline:-24px;padding-inline:24px;border-radius:12px;border-top-color:transparent}
.day ul{margin:6px 0 0;padding-left:0;list-style:none;color:var(--muted);font-size:15.5px}
.day li{margin:4px 0;padding-left:16px;position:relative}
.day li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--line)}
.day.done h3{color:var(--faint);text-decoration:line-through}
.check{display:flex;align-items:center;gap:8px;font-size:15px;white-space:nowrap;color:var(--muted)}
.check input{width:22px;height:22px;accent-color:var(--accent)}
@media (max-width:560px){.day{grid-template-columns:1fr;gap:8px}.day .date b{display:inline;margin-inline:4px 6px}.day.today{margin-inline:-18px;padding-inline:18px}}
table.data{border-collapse:collapse;width:100%;font-size:15.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{font-size:13.5px;color:var(--faint);font-weight:400}
table.data td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
a{color:var(--accent)}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
ul.clean b{color:var(--ink)}
.res li{margin:6px 0}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card .small{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.card .small button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted)}
.card .small button:hover{color:var(--ink);border-color:var(--faint)}
.card .reveal{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:9px 14px;font-weight:700;text-align:left}

/* ---- user-selectable themes (override system light/dark) ---- */
:root[data-skin="warm"]{
  --ground:#FAF6EF; --surface:#FFFDF8; --sunk:#F3ECE0; --ink:#2A2118; --muted:#5C4F42; --faint:#7D6F60; --line:#E8DDCC;
  --accent:#B4531F; --accent-ink:#FFFFFF; --accent-soft:#FBE9DC;
  --good:#3F7D3A; --good-soft:#E6F2E1; --bad:#B63A2E; --bad-soft:#FBE6E2; --warn:#9A6408; --warn-soft:#FBF0D6;
  --grid:#A8998A; --cell:#FFFDF8; --shadow:0 1px 2px rgba(60,40,20,.06),0 2px 8px rgba(60,40,20,.05);
}
:root[data-skin="forest"]{
  --ground:#F2F6F3; --surface:#FFFFFF; --sunk:#E8F0EA; --ink:#13241B; --muted:#43574B; --faint:#62756A; --line:#D7E3DB;
  --accent:#1F7A55; --accent-ink:#FFFFFF; --accent-soft:#DDF0E6;
  --good:#1F7A3D; --good-soft:#E2F4E8; --bad:#B8392F; --bad-soft:#FBE7E5; --warn:#936A0C; --warn-soft:#FAF1D8;
  --grid:#93A69A; --cell:#FFFFFF; --shadow:0 1px 2px rgba(19,36,27,.05),0 2px 8px rgba(19,36,27,.04);
}
:root[data-skin="night"]{
  --ground:#0B0F17; --surface:#131A26; --sunk:#1B2332; --ink:#E9EDF5; --muted:#AEB8C8; --faint:#8791A3; --line:#263044;
  --accent:#F5B84A; --accent-ink:#1D1403; --accent-soft:#33291A;
  --good:#62D394; --good-soft:#14301F; --bad:#FF8C82; --bad-soft:#3B1D1C; --warn:#F5C866; --warn-soft:#3A2F14;
  --grid:#5E6B80; --cell:#E9EDF5; --shadow:none;
}
:root[data-skin="clean"]{
  --ground:#F6F7F9; --surface:#FFFFFF; --sunk:#F0F2F5; --ink:#111827; --muted:#4B5563; --faint:#6B7280; --line:#E3E6EB;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#EAF0FD;
  --good:#15803D; --good-soft:#E7F6EC; --bad:#C2352B; --bad-soft:#FCEBEA; --warn:#A16207; --warn-soft:#FDF3DC;
  --grid:#9CA3AF; --cell:#FFFFFF; --shadow:0 1px 2px rgba(17,24,39,.05),0 2px 8px rgba(17,24,39,.04);
}
:root[data-skin="warm"],:root[data-skin="forest"],:root[data-skin="clean"]{color-scheme:light}
:root[data-skin="night"]{color-scheme:dark}
.skins{display:flex;align-items:center;gap:6px}
.skins span{font-size:13.5px;color:var(--faint);margin-right:2px}
.skin{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 5px;font-size:13.5px;color:var(--muted)}
.skin i{width:18px;height:18px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.08)}
.skin[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:700;box-shadow:0 0 0 2px var(--accent-soft)}
@media (max-width:560px){.skin b{display:none}.skin{padding:4px}.skins span{display:none}}
/* ---- v5 components ---- */
.btn.sm{padding:6px 13px;min-height:36px;font-size:14.5px;text-decoration:none;display:inline-flex;align-items:center}
a.btn.primary{color:var(--accent-ink)} a.btn{color:var(--ink)}
.switch{width:46px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"] i{left:23px}
.pace{font-size:13.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.pace:empty{display:none}
.pace.good{background:var(--good-soft);color:var(--good)} .pace.warn{background:var(--warn-soft);color:var(--warn)} .pace.bad{background:var(--bad-soft);color:var(--bad)}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.task.done>div>p{color:var(--faint);text-decoration:line-through}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--accent-ink);font-weight:700;padding:0;line-height:1}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.progressring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex-shrink:0}
.progressring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px}
.ai{margin-top:10px}
.ai .btn{padding:6px 10px;min-height:34px;font-size:14.5px;color:var(--accent)}
.ai-out{margin-top:8px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;white-space:pre-wrap;font-size:15px}
/* ---- public edition ---- */
.setup{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px 20px}
.setup label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.setup input,.setup select{font:inherit;font-weight:400;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:46px}
.setup input:focus,.setup select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font:inherit}
.foot{margin-top:40px;font-size:13.5px;color:var(--faint);text-align:center}
.foot a{color:var(--faint)}
