<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dMAT Drill Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free, open-source practice app for the dMAT (digital Master Test): timed core-module generators, subject-module tests, mock exams, a mistake bank, trick cards and a study plan built around your exam date.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5BD3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drill Room">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#F6F7F9; --surface:#FFFFFF; --sunk:#F0F2F5; --ink:#111827; --muted:#4B5563; --faint:#6B7280; --line:#E3E6EB;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#EAF0FD;
  --good:#15803D; --good-soft:#E7F6EC; --bad:#C2352B; --bad-soft:#FCEBEA; --warn:#A16207; --warn-soft:#FDF3DC;
  --grid:#9CA3AF; --cell:#FFFFFF; --shadow:0 1px 2px rgba(17,24,39,.05),0 2px 8px rgba(17,24,39,.04);
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:var(--body);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1116; --surface:#171B22; --sunk:#1F242D; --ink:#EEF1F5; --muted:#B4BCC8; --faint:#8C95A3; --line:#2A303A;
  --accent:#7EA2FF; --accent-ink:#0B1530; --accent-soft:#1C2742;
  --good:#5FD08A; --good-soft:#14301F; --bad:#FF8A80; --bad-soft:#3A1D1B; --warn:#F2C45A; --warn-soft:#3A2F14;
  --grid:#6B7280; --cell:#EEF1F5; --shadow:none;
}}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#171B22; --sunk:#1F242D; --ink:#EEF1F5; --muted:#B4BCC8; --faint:#8C95A3; --line:#2A303A;
  --accent:#7EA2FF; --accent-ink:#0B1530; --accent-soft:#1C2742;
  --good:#5FD08A; --good-soft:#14301F; --bad:#FF8A80; --bad-soft:#3A1D1B; --warn:#F2C45A; --warn-soft:#3A2F14;
  --grid:#6B7280; --cell:#EEF1F5; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;padding-inline:16px;padding-block:0 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25;font-weight:700}
h1{font-size:21px;letter-spacing:-.01em}
h2{font-size:24px;letter-spacing:-.01em}
h3{font-size:17.5px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:14px;color:var(--faint);font-weight:400}
header.top{padding-block:16px 12px;margin-bottom:24px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .muted{font-size:14px;color:var(--faint)}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--accent);font-weight:700}
nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;padding:4px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);width:max-content;max-width:100%}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:9px;color:var(--muted);white-space:nowrap;font-size:15.5px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
@media (max-width:560px){.panel{padding:18px}}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:700;font-size:15.5px;min-height:44px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.big{padding:14px 28px;font-size:17px;min-height:52px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;gap:8px;background:none;border:0}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;color:var(--muted);font-size:15px}
.seg button:hover{border-color:var(--faint);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.label{font-size:14px;font-weight:700;color:var(--ink);min-width:88px}
.step{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);font-weight:700}
.step i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pick{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--faint)}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick .meta{font-size:14px;color:var(--faint)}
.pick .muted{font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
/* session */
.sessbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:-24px -24px 18px;padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
@media (max-width:560px){.sessbar{margin:-18px -18px 16px;padding:12px 18px}}
.timer{font-family:var(--mono);font-size:22px;font-weight:700;padding:6px 14px;border-radius:10px;background:var(--sunk)}
.timer.warn{background:var(--warn-soft);color:var(--warn)} .timer.crit{background:var(--bad-soft);color:var(--bad)}
.navstrip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.navstrip button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12.5px;padding:0;color:var(--muted)}
.navstrip button.done{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.navstrip button.cur{border:2px solid var(--accent);color:var(--ink);font-weight:700}
.navstrip button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.navstrip button.ok{background:var(--good-soft);border-color:transparent;color:var(--good)} .navstrip button.no{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.noteban{font-size:14px;color:var(--faint)}
/* latin */
.ls{border-collapse:collapse;font-family:var(--mono);font-size:22px;font-weight:700;margin:4px 0}
.ls td,.ls th{width:52px;height:52px;text-align:center;border:1.5px solid var(--grid)}
.ls th{border:0;font-size:13px;color:var(--faint);font-weight:500;width:auto;height:auto;padding:4px 6px}
.ls td.q{background:var(--warn-soft);color:var(--warn)}
.ls td.fill{color:var(--accent)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-width:58px;height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:20px;font-weight:700}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* equations */
.eqs{font-family:var(--mono);font-size:23px;display:flex;flex-direction:column;gap:8px;padding:18px 24px;background:var(--sunk);border-radius:12px;width:max-content;max-width:100%}
.ansrow{display:flex;gap:16px;flex-wrap:wrap}
.ansrow label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:21px;font-weight:700}
.ansrow input{width:78px;height:50px;font:inherit;font-size:21px;text-align:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.ansrow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ansrow input.right{border-color:var(--good);background:var(--good-soft)} .ansrow input.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* figures */
.figrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.frame{display:flex;flex-direction:column;align-items:center;gap:4px}
.frame svg,.figopt svg{width:112px;height:112px;display:block}
.qslot{width:112px;height:112px;border:2px dashed var(--grid);border-radius:8px;display:grid;place-items:center;font-size:34px;color:var(--faint)}
.figcols{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px}
.figcol{display:flex;flex-direction:column;gap:8px;align-items:center}
.figopt{border:2.5px solid transparent;border-radius:10px;padding:4px;background:none}
.figopt:hover{border-color:var(--line)}
.figopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.figopt.right{border-color:var(--good);background:var(--good-soft)} .figopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.scroll-x{overflow-x:auto}
/* subject */
.subj{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.subj{grid-template-columns:1fr}}
.passage{max-height:68vh;overflow:auto;padding:4px 10px 4px 0;display:flex;flex-direction:column;gap:12px;max-width:66ch;font-size:17px;line-height:1.7}
.passage table{border-collapse:collapse;font-size:15px}
.passage td,.passage th{border:1px solid var(--line);padding:5px 10px;text-align:center}
.passage th{background:var(--sunk)}
.passage>*{flex-shrink:0}
.passage svg{width:100%;max-width:380px;height:auto;display:block}
.passage ul{margin:0;padding-left:20px}
.qtext{font-size:18px;font-weight:700;line-height:1.5}
.mcq{display:flex;flex-direction:column;gap:10px}
.mcq button{text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:13px 16px;display:flex;gap:12px;align-items:baseline;font-size:16.5px;min-height:52px}
.mcq button:hover{border-color:var(--accent)}
.mcq button .l{font-family:var(--mono);font-weight:700;color:var(--faint)}
.mcq button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mcq button.right{border-color:var(--good);background:var(--good-soft)} .mcq button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{background:var(--sunk);border-radius:12px;padding:14px 18px;font-size:15.5px;line-height:1.6}
.explain ol,.explain ul{margin:6px 0 0;padding-left:20px}
.trick{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.trick b{color:var(--accent)}
/* results */
.big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpis{display:flex;gap:28px;flex-wrap:wrap}
.review{display:flex;flex-direction:column;gap:6px}
.reviewitem{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:10px}
.reviewitem summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* plan */
.day{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:18px;align-items:start;padding:18px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .date{font-size:14px;color:var(--faint);line-height:1.3}
.day .date b{display:block;font-size:20px;color:var(--ink)}
.day.today{background:var(--accent-soft);margin-inline:-24px;padding-inline:24px;border-radius:12px;border-top-color:transparent}
.day ul{margin:6px 0 0;padding-left:0;list-style:none;color:var(--muted);font-size:15.5px}
.day li{margin:4px 0;padding-left:16px;position:relative}
.day li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--line)}
.day.done h3{color:var(--faint);text-decoration:line-through}
.check{display:flex;align-items:center;gap:8px;font-size:15px;white-space:nowrap;color:var(--muted)}
.check input{width:22px;height:22px;accent-color:var(--accent)}
@media (max-width:560px){.day{grid-template-columns:1fr;gap:8px}.day .date b{display:inline;margin-inline:4px 6px}.day.today{margin-inline:-18px;padding-inline:18px}}
table.data{border-collapse:collapse;width:100%;font-size:15.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{font-size:13.5px;color:var(--faint);font-weight:400}
table.data td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
a{color:var(--accent)}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
ul.clean b{color:var(--ink)}
.res li{margin:6px 0}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card .small{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.card .small button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted)}
.card .small button:hover{color:var(--ink);border-color:var(--faint)}
.card .reveal{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:9px 14px;font-weight:700;text-align:left}

/* ---- user-selectable themes (override system light/dark) ---- */
:root[data-skin="warm"]{
  --ground:#FAF6EF; --surface:#FFFDF8; --sunk:#F3ECE0; --ink:#2A2118; --muted:#5C4F42; --faint:#7D6F60; --line:#E8DDCC;
  --accent:#B4531F; --accent-ink:#FFFFFF; --accent-soft:#FBE9DC;
  --good:#3F7D3A; --good-soft:#E6F2E1; --bad:#B63A2E; --bad-soft:#FBE6E2; --warn:#9A6408; --warn-soft:#FBF0D6;
  --grid:#A8998A; --cell:#FFFDF8; --shadow:0 1px 2px rgba(60,40,20,.06),0 2px 8px rgba(60,40,20,.05);
}
:root[data-skin="forest"]{
  --ground:#F2F6F3; --surface:#FFFFFF; --sunk:#E8F0EA; --ink:#13241B; --muted:#43574B; --faint:#62756A; --line:#D7E3DB;
  --accent:#1F7A55; --accent-ink:#FFFFFF; --accent-soft:#DDF0E6;
  --good:#1F7A3D; --good-soft:#E2F4E8; --bad:#B8392F; --bad-soft:#FBE7E5; --warn:#936A0C; --warn-soft:#FAF1D8;
  --grid:#93A69A; --cell:#FFFFFF; --shadow:0 1px 2px rgba(19,36,27,.05),0 2px 8px rgba(19,36,27,.04);
}
:root[data-skin="night"]{
  --ground:#0B0F17; --surface:#131A26; --sunk:#1B2332; --ink:#E9EDF5; --muted:#AEB8C8; --faint:#8791A3; --line:#263044;
  --accent:#F5B84A; --accent-ink:#1D1403; --accent-soft:#33291A;
  --good:#62D394; --good-soft:#14301F; --bad:#FF8C82; --bad-soft:#3B1D1C; --warn:#F5C866; --warn-soft:#3A2F14;
  --grid:#5E6B80; --cell:#E9EDF5; --shadow:none;
}
:root[data-skin="clean"]{
  --ground:#F6F7F9; --surface:#FFFFFF; --sunk:#F0F2F5; --ink:#111827; --muted:#4B5563; --faint:#6B7280; --line:#E3E6EB;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#EAF0FD;
  --good:#15803D; --good-soft:#E7F6EC; --bad:#C2352B; --bad-soft:#FCEBEA; --warn:#A16207; --warn-soft:#FDF3DC;
  --grid:#9CA3AF; --cell:#FFFFFF; --shadow:0 1px 2px rgba(17,24,39,.05),0 2px 8px rgba(17,24,39,.04);
}
:root[data-skin="warm"],:root[data-skin="forest"],:root[data-skin="clean"]{color-scheme:light}
:root[data-skin="night"]{color-scheme:dark}
.skins{display:flex;align-items:center;gap:6px}
.skins span{font-size:13.5px;color:var(--faint);margin-right:2px}
.skin{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 5px;font-size:13.5px;color:var(--muted)}
.skin i{width:18px;height:18px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.08)}
.skin[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:700;box-shadow:0 0 0 2px var(--accent-soft)}
@media (max-width:560px){.skin b{display:none}.skin{padding:4px}.skins span{display:none}}
/* ---- v5 components ---- */
.btn.sm{padding:6px 13px;min-height:36px;font-size:14.5px;text-decoration:none;display:inline-flex;align-items:center}
a.btn.primary{color:var(--accent-ink)} a.btn{color:var(--ink)}
.switch{width:46px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"] i{left:23px}
.pace{font-size:13.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.pace:empty{display:none}
.pace.good{background:var(--good-soft);color:var(--good)} .pace.warn{background:var(--warn-soft);color:var(--warn)} .pace.bad{background:var(--bad-soft);color:var(--bad)}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.task.done>div>p{color:var(--faint);text-decoration:line-through}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--accent-ink);font-weight:700;padding:0;line-height:1}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.progressring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex-shrink:0}
.progressring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px}
.ai{margin-top:10px}
.ai .btn{padding:6px 10px;min-height:34px;font-size:14.5px;color:var(--accent)}
.ai-out{margin-top:8px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;white-space:pre-wrap;font-size:15px}
/* ---- public edition ---- */
.setup{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px 20px}
.setup label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.setup input,.setup select{font:inherit;font-weight:400;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:46px}
.setup input:focus,.setup select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.figopt .figmark:empty{display:none}
.figopt.right .figmark{background:var(--good)} .figopt.wrong .figmark{background:var(--bad)}

}

<script>
/* ===== dMAT practice engine: generators ===== */
const RNG = {
  int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
};

/* ---------- LATIN SQUARES ---------- */
const LETTERS=['A','B','C','D','E'];
function fullLatin(){
  const rows=RNG.shuffle([0,1,2,3,4]), cols=RNG.shuffle([0,1,2,3,4]), sym=RNG.shuffle(LETTERS);
  return rows.map(r=>cols.map(c=>sym[(r+c)%5]));
}
const COLN=['α','β','γ','δ','ε'];
function cellName(r,c){return COLN[c]+(r+1);}
// propagate singles; returns {steps:[...], grid, solvedTarget:boolean, stepsToTarget}
function lsSolve(grid,tr,tc){
  const g=grid.map(r=>r.slice()); const steps=[];
  const cand=(r,c)=>LETTERS.filter(L=>!g[r].includes(L)&&!g.map(x=>x[c]).includes(L));
  let progress=true;
  while(progress){
    progress=false;
    // naked singles
    for(let r=0;r<5&&!progress;r++)for(let c=0;c<5&&!progress;c++){
      if(g[r][c])continue; const k=cand(r,c);
      if(k.length===0)return {fail:true};
      if(k.length===1){g[r][c]=k[0];steps.push({r,c,v:k[0],why:`${cellName(r,c)} = ${k[0]}: every other letter already appears in row ${r+1} or column ${COLN[c]}.`});progress=true;}
    }
    if(progress){ if(g[tr][tc])break; continue;}
    // hidden singles in rows / cols
    for(let u=0;u<5&&!progress;u++)for(const L of LETTERS){
      if(!g[u].includes(L)){
        const spots=[0,1,2,3,4].filter(c=>!g[u][c]&&cand(u,c).includes(L));
        if(spots.length===1){const c=spots[0];g[u][c]=L;steps.push({r:u,c,v:L,why:`${cellName(u,c)} = ${L}: row ${u+1} still needs ${L} and this is the only open cell where ${L} is not blocked by its column.`});progress=true;break;}
      }
      const col=g.map(x=>x[u]);
      if(!col.includes(L)){
        const spots=[0,1,2,3,4].filter(r=>!g[r][u]&&cand(r,u).includes(L));
        if(spots.length===1){const r=spots[0];g[r][u]=L;steps.push({r,c:u,v:L,why:`${cellName(r,u)} = ${L}: column ${COLN[u]} still needs ${L} and this is the only open cell where ${L} is not blocked by its row.`});progress=true;break;}
      }
    }
    if(g[tr][tc])break;
  }
  return {grid:g,steps,solved:!!g[tr][tc]};
}
function genLatin(diff){
  const range={low:[1,1],medium:[2,4],high:[5,12]}[diff];
  const givensRange={low:[12,17],medium:[10,14],high:[8,12]}[diff];
  for(let attempt=0;attempt<400;attempt++){
    const full=fullLatin(); const tr=RNG.int(0,4), tc=RNG.int(0,4);
    const g=full.map(r=>r.slice()); g[tr][tc]=null;
    const cells=RNG.shuffle([...Array(25).keys()].filter(i=>i!==tr*5+tc));
    let best=null;
    for(const i of cells){
      const r=Math.floor(i/5),c=i%5, keep=g[r][c]; g[r][c]=null;
      const s=lsSolve(g,tr,tc);
      if(!s.solved){g[r][c]=keep;continue;}
      const givens=g.flat().filter(Boolean).length;
      const n=s.steps.length;
      if(n>=range[0]&&n<=range[1]&&givens>=givensRange[0]&&givens<=givensRange[1]){best={grid:g.map(x=>x.slice()),steps:s.steps};}
      if(givens<givensRange[0])break;
    }
    if(best){
      // low: prefer at least a few blanks
      return {type:'latin',diff,grid:best.grid,tr,tc,answer:full[tr][tc],steps:best.steps};
    }
  }
  return genLatin(diff==='high'?'medium':'low');
}

/* ---------- MATHEMATICAL EQUATIONS ---------- */
const VN=['A','B','C','D'];
function eqTemplates(v,names){
  // v: values array, names letters. returns list of {txt, f(vals)=>bool, vars:[idx], single:bool}
  const out=[]; const n=v.length;
  const add=(txt,f,vars)=>out.push({txt,f,vars});
  for(let i=0;i<n;i++){
    const X=names[i],x=v[i];
    const k=RNG.int(2,15);
    add(`${k} + ${X} = ${k+x}`,a=>k+a[i]===k+x,[i]);
    if(x>2) {const m=RNG.int(1,x-1); add(`${X} – ${m} = ${x-m}`,a=>a[i]-m===x-m,[i]);}
    const t=x+RNG.int(1,10); add(`${t} – ${X} = ${t-x}`,a=>t-a[i]===t-x,[i]);
    for(let j=0;j<n;j++){ if(i===j)continue; const Y=names[j],y=v[j];
      if(y>x) add(`${X} + ${y-x} = ${Y}`,a=>a[i]+(y-x)===a[j],[i,j]);
      if(x>y) add(`${X} – ${x-y} = ${Y}`,a=>a[i]-(x-y)===a[j],[i,j]);
      if(y%x===0&&y/x>1) add(`${y/x} × ${X} = ${Y}`,a=>(y/x)*a[i]===a[j],[i,j]);
      if(x%y===0&&x/y>1) add(`${X} ÷ ${x/y} = ${Y}`,a=>a[i]/(x/y)===a[j],[i,j]);
      if(i<j){
        add(`${X} + ${Y} = ${x+y}`,a=>a[i]+a[j]===x+y,[i,j]);
        if(x!==y) add(x>y?`${X} – ${Y} = ${x-y}`:`${Y} – ${X} = ${y-x}`,a=>Math.abs(a[i]-a[j])===Math.abs(x-y)&&(x>y?a[i]>a[j]:a[j]>a[i]),[i,j]);
        add(`${x+y} – ${Y} = ${X}`,a=>(x+y)-a[j]===a[i],[i,j]);
      }
      const m=RNG.int(2,4); const r=m*x-y; if(Math.abs(r)>12){} else if(r>0) add(`${m} × ${X} – ${r} = ${Y}`,a=>m*a[i]-r===a[j],[i,j]); else if(r<0) add(`${m} × ${X} + ${-r} = ${Y}`,a=>m*a[i]-r===a[j],[i,j]);
      for(let k2=0;k2<n;k2++){ if(k2===i||k2===j||j<i)continue; const Z=names[k2],z=v[k2];
        if(x+y===z) add(`${X} + ${Y} = ${Z}`,a=>a[i]+a[j]===a[k2],[i,j,k2]);
        const s=x+y-z; if(s>0) add(`${X} + ${Y} – ${Z} = ${s}`,a=>a[i]+a[j]-a[k2]===s,[i,j,k2]);
        const p=2*x+2*y; if(p===z) add(`2 × ${X} + 2 × ${Y} = ${Z}`,a=>2*a[i]+2*a[j]===a[k2],[i,j,k2]);
        const q=x*y; if(q===z) add(`${X} × ${Y} = ${Z}`,a=>a[i]*a[j]===a[k2],[i,j,k2]);
      }
    }
  }
  if(n===4){
    const s=v[0]-v[1]+v[2]-v[3]; if(s>0) add(`A – B + C – D = ${s}`,a=>a[0]-a[1]+a[2]-a[3]===s,[0,1,2,3]);
    const s2=v[0]+v[1]-v[2]+v[3]; if(s2>0) add(`A + B – C + D = ${s2}`,a=>a[0]+a[1]-a[2]+a[3]===s2,[0,1,2,3]);
    const s3=v[2]+v[3]-v[0]; if(s3>0) add(`C + D – A = ${s3}`,a=>a[2]+a[3]-a[0]===s3,[0,2,3]);
  }
  return out;
}
function countSolutions(eqs,n){
  let cnt=0, sol=null; const a=new Array(n).fill(1);
  const rec=d=>{ if(cnt>1)return; if(d===n){ if(eqs.every(e=>e.f(a))){cnt++;sol=a.slice();} return;}
    for(let x=1;x<=20;x++){a[d]=x;rec(d+1);} };
  rec(0); return {cnt,sol};
}
function genEquations(diff){
  const n={low:2,medium:3,high:4}[diff];
  for(let attempt=0;attempt<500;attempt++){
    const v=Array.from({length:n},()=>RNG.int(1,20)); const names=VN.slice(0,n);
    const T=eqTemplates(v,names);
    const singles=T.filter(t=>t.vars.length===1), multis=T.filter(t=>t.vars.length>1);
    let eqs=[];
    const maxSingles=diff==='low'?1:0;
    const pool=RNG.shuffle(multis);
    if(maxSingles&&Math.random()<0.6) eqs.push(RNG.pick(singles));
    for(const t of pool){ if(eqs.length>=n)break;
      if(diff==='high'&&eqs.length===0&&t.vars.length<3)continue;
      if(eqs.some(e=>e.txt===t.txt))continue; eqs.push(t);}
    if(eqs.length<n)continue;
    // every var appears
    if(!names.every((_,i)=>eqs.some(e=>e.vars.includes(i))))continue;
    if(diff!=='low'&&eqs.filter(e=>e.vars.length===1).length>0)continue;
    const {cnt,sol}=countSolutions(eqs,n);
    if(cnt===1){
      return {type:'eq',diff,eqs:RNG.shuffle(eqs).map(e=>e.txt),names,answer:sol};
    }
  }
  return genEquations(diff);
}

/* ---------- FIGURE SEQUENCES (4x4) ---------- */
const N=4;
const SHAPES=['tri','hex','sq','half','ell','trap','arrow','circ'];
const ORIENTED={tri:true,half:true,ell:true,trap:true,arrow:true,hex:false,sq:false,circ:false};
const COLORS={black:'#1d1d1f',pink:'#d9559c',yellow:'#f2d23c',green:'#1f9e74',orange:'#f08a24',white:'#ffffff',blue:'#2f6fd6'};
const COLN2=Object.keys(COLORS);
const RING=(()=>{const r=[];for(let c=0;c<N;c++)r.push([0,c]);for(let q=1;q<N;q++)r.push([q,N-1]);for(let c=N-2;c>=0;c--)r.push([N-1,c]);for(let q=N-2;q>=1;q--)r.push([q,0]);return r;})(); // clockwise 12
function bounce(len,start,dir,t){ // position along 0..len-1 with reflection
  if(len===1)return 0; const P=2*(len-1); let p=((start*(dir>0?1:-1)+ (dir>0?0:0)));
  // map to unfolded coordinate
  let u = dir>0? start : (P - start)%P; u=(u+t)%P; return u<len? u : P-u;
}
function tri(k){return k*(k+1)/2;} // cumulative for x+1: after t transitions = t(t+1)/2
function makeMover(){
  const kind=RNG.pick(['line','line','diag','ring','ring','cycle']);
  const m={kind};
  if(kind==='line'){m.axis=RNG.pick(['h','v']);m.fixed=RNG.int(0,3);m.start=RNG.int(0,3);m.dir=RNG.pick([1,-1]);m.step=1;
    m.desc=`moves ${m.axis==='h'?'horizontally':'vertically'} one field at a time in ${m.axis==='h'?'row':'column'} ${m.fixed+1} and bounces off the border`;}
  if(kind==='diag'){
    const dr=RNG.pick([1,-1]),dc=RNG.pick([1,-1]);
    // build maximal diagonal segment through random cell
    let r=RNG.int(0,3),c=RNG.int(0,3); while(r-dr>=0&&r-dr<N&&c-dc>=0&&c-dc<N){r-=dr;c-=dc;}
    const seg=[];while(r>=0&&r<N&&c>=0&&c<N){seg.push([r,c]);r+=dr;c+=dc;}
    if(seg.length<3)return makeMover();
    m.seg=seg;m.start=RNG.int(0,seg.length-1);m.dir=RNG.pick([1,-1]);
    const vd=(dr*m.dir>0)?'downwards':'upwards', hd=(dc*m.dir>0)?'right':'left';
    m.desc=`moves diagonally ${vd} to the ${hd} one field at a time, bounces off the border and returns the same way`;
  }
  if(kind==='ring'){m.start=RNG.int(0,11);m.dir=RNG.pick([1,-1]);m.step=RNG.pick([1,1,2,'x+1']);
    m.desc=`moves along the outer border ${m.dir>0?'clockwise':'counter-clockwise'} by ${m.step==='x+1'?'x + 1 fields (1, then 2, then 3 …)':m.step===2?'two fields':'one field'} at a time`;}
  if(kind==='cycle'){const base=[[0,-1,'left'],[-1,0,'up'],[0,1,'right'],[1,0,'down']];const rot=RNG.int(0,3);let seq=base.slice(rot).concat(base.slice(0,rot));if(Math.random()<.5)seq=[seq[0],seq[3],seq[2],seq[1]];
    m.seq=seq;
    // choose start so the 2x2 loop fits
    for(let k=0;k<50;k++){const r=RNG.int(0,3),c=RNG.int(0,3);let rr=r,cc=c,ok=true;for(let t=0;t<6;t++){if(t>0){rr+=seq[(t-1)%4][0];cc+=seq[(t-1)%4][1];}if(rr<0||rr>3||cc<0||cc>3)ok=false;}if(ok){m.r=r;m.c=c;break;}}
    if(m.r===undefined)return makeMover();
    m.desc=`moves one field per image in the repeating order ${seq.map(s=>s[2]).join(', ')}`;}
  return m;
}
function posAt(m,t){
  if(m.kind==='line'){const p=bounce(4,m.start,m.dir,t);return m.axis==='h'?[m.fixed,p]:[p,m.fixed];}
  if(m.kind==='diag'){const p=bounce(m.seg.length,m.start,m.dir,t);return m.seg[p];}
  if(m.kind==='ring'){const d=m.step==='x+1'?tri(t):m.step*t;const i=(((m.start+m.dir*d)%12)+12)%12;return RING[i];}
  if(m.kind==='cycle'){let r=m.r,c=m.c;for(let k=0;k<t;k++){r+=m.seq[k%4][0];c+=m.seq[k%4][1];}return [r,c];}
}
function makeFigure(diff,used){
  const shape=RNG.pick(SHAPES.filter(s=>!used.has(s))); used.add(shape);
  const f={shape,mover:makeMover()};
  const extras=diff==='low'?0:diff==='medium'?RNG.pick([0,1,1]):RNG.pick([1,1,2]);
  const opts=RNG.shuffle(ORIENTED[shape]?['rot','col']:['col']).slice(0,extras);
  f.rot=null; f.cols=null;
  f.baseRot=ORIENTED[shape]?RNG.pick([0,90,180,270]):0;
  if(opts.includes('rot')){f.rot={dir:RNG.pick([1,-1]),mode:diff==='high'&&Math.random()<.4?'x+1':RNG.pick([1,1,2])};}
  const nc=RNG.pick([2,2,3]); const cl=RNG.shuffle(COLN2).slice(0,nc);
  if(opts.includes('col')) f.cols=cl; else f.color=cl[0];
  if(f.rot&&f.rot.mode===2&&!ORIENTED[shape])f.rot=null;
  return f;
}
function stateAt(f,t){
  const [r,c]=posAt(f.mover,t);
  let rot=f.baseRot;
  if(f.rot){const k=f.rot.mode==='x+1'?tri(t):f.rot.mode*t; rot=(((f.baseRot+f.rot.dir*90*k)%360)+360)%360;}
  const color=f.cols?f.cols[t%f.cols.length]:f.color;
  return {shape:f.shape,r,c,rot,color};
}
function figDesc(f){
  const nm={tri:'triangle',hex:'hexagon',sq:'square',half:'half-circle',ell:'L-corner',trap:'arrow-head',arrow:'arrow',circ:'circle'}[f.shape];
  let s=`The ${f.cols?'':f.color+' '}${nm} ${f.mover.desc}`;
  if(f.rot){s+=f.rot.mode==='x+1'?`; it turns 90° ${f.rot.dir>0?'right':'left'} x + 1 times (1×, 2×, 3× …)`:`; it turns ${90*f.rot.mode}° to the ${f.rot.dir>0?'right':'left'} each image`;}
  if(f.cols){s+=`; its colour cycles ${f.cols.join(' → ')}`;}
  return s+'.';
}
const key=fr=>fr.map(s=>`${s.shape}${s.r}${s.c}${s.rot}${s.color}`).sort().join('|');
const valid=fr=>new Set(fr.map(s=>s.r*4+s.c)).size===fr.length;
function mutate(frame,figs,t){
  const out=frame.map(s=>({...s})); const i=RNG.int(0,out.length-1); const s=out[i], f=figs[i];
  const kinds=[];
  kinds.push('pos','pos'); if(ORIENTED[s.shape])kinds.push('rot'); if(f.cols||Math.random()<.3)kinds.push('col');
  const k=RNG.pick(kinds);
  if(k==='pos'){
    const alt=RNG.pick([t-1,t+1,t+2].filter(x=>x>=0)); const [r,c]=posAt(f.mover,alt);
    if(r===s.r&&c===s.c){const d=RNG.pick([[0,1],[1,0],[0,-1],[-1,0]]);s.r=Math.min(3,Math.max(0,s.r+d[0]));s.c=Math.min(3,Math.max(0,s.c+d[1]));}
    else{s.r=r;s.c=c;}
  }
  if(k==='rot'){s.rot=(s.rot+RNG.pick([90,180,270]))%360;}
  if(k==='col'){const pool=f.cols?f.cols:COLN2;s.color=RNG.pick(pool.filter(x=>x!==s.color))||RNG.pick(COLN2.filter(x=>x!==s.color));}
  return out;
}
function genFigures(diff){
  const nf={low:RNG.pick([1,1,2]),medium:RNG.pick([2,3]),high:RNG.pick([3,4])}[diff];
  for(let attempt=0;attempt<300;attempt++){
    const used=new Set(); const figs=Array.from({length:nf},()=>makeFigure(diff,used));
    if(diff==='high'&&!figs.some(f=>f.mover.step==='x+1'||(f.rot&&f.rot.mode==='x+1'))&&Math.random()<.7){const f=figs[0];if(f.mover.kind==='ring')f.mover.step='x+1';else if(ORIENTED[f.shape]){f.rot={dir:1,mode:'x+1'};}}
    if(diff==='high'){for(const f of figs)f.mover.desc=makeDescFix(f.mover);}
    const frames=[0,1,2,3,4,5].map(t=>figs.map(f=>stateAt(f,t)));
    if(!frames.every(valid))continue;
    // frames must differ
    if(new Set(frames.map(key)).size<4)continue;
    const answers=[4,5].map(t=>{
      const correct=frames[t]; const opts=[correct]; const keys=new Set([key(correct)]);
      let g=0; while(opts.length<3&&g<200){g++;const m=mutate(correct,figs,t);if(valid(m)&&!keys.has(key(m))){keys.add(key(m));opts.push(m);}}
      const sh=RNG.shuffle(opts); return {options:sh,correct:sh.indexOf(correct)};
    });
    if(answers.some(a=>a.options.length<3))continue;
    return {type:'fig',diff,frames:frames.slice(0,4),answers,explain:figs.map(figDesc)};
  }
  return genFigures(diff);
}
function makeDescFix(m){ if(m.kind==='ring'){return `moves along the outer border ${m.dir>0?'clockwise':'counter-clockwise'} by ${m.step==='x+1'?'x + 1 fields (1, then 2, then 3 …)':m.step===2?'two fields':'one field'} at a time`;} return m.desc; }


const PASSAGES=[
{id:'stats',title:'Describing Data: Centre and Spread',domain:'Statistics',text:`<p>Descriptive statistics summarise a data set with a few numbers. The <b>arithmetic mean</b> is the sum of all values divided by their number. The <b>median</b> is the middle value once the data are sorted (for an even number of values, the mean of the two middle values). The <b>mode</b> is the most frequent value. The <b>range</b> is the difference between the largest and smallest value.</p><p>The <b>standard deviation</b> (SD) measures how far values typically lie from the mean; the <b>variance</b> is the square of the SD. The mean and the SD react strongly to extreme values (outliers), whereas the median is considered <i>robust</i>.</p><p>A researcher recorded the commuting times (in minutes) of seven employees:</p><table><tr><th>Employee</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr><tr><th>Minutes</th><td>12</td><td>15</td><td>15</td><td>18</td><td>20</td><td>22</td><td>45</td></tr></table>`,
qs:[
{q:'What is the median commuting time?',o:['15 minutes','18 minutes','20 minutes','21 minutes'],a:1,e:'Sorted values: 12, 15, 15, <b>18</b>, 20, 22, 45 — the 4th of 7 values is 18.'},
{q:'What is the mean commuting time?',o:['18 minutes','19 minutes','21 minutes','23 minutes'],a:2,e:'Sum = 147; 147 ÷ 7 = 21.'},
{q:'The value 45 is corrected to 25. Which statement is correct?',o:['Mean and median both decrease.','The mean decreases; the median stays the same.','The median decreases; the mean stays the same.','Neither the mean nor the median changes.'],a:1,e:'The largest value changes but stays the largest, so the middle value (18) is unchanged. The sum drops by 20, so the mean falls (to about 18.1).'},
{q:'What is the mode of the data?',o:['12','15','18','There is no mode.'],a:1,e:'15 occurs twice; every other value once.'},
{q:'Every employee\'s commute becomes 5 minutes longer. What happens?',o:['Mean +5, SD +5','Mean +5, SD unchanged','Mean unchanged, SD +5','Mean ×5, SD ×5'],a:1,e:'Adding a constant shifts all values equally: the centre moves, the spread does not.'},
{q:'All values are doubled (e.g. converted to a longer route). How does the variance change?',o:['It stays the same.','It doubles.','It quadruples.','It halves.'],a:2,e:'Multiplying by 2 doubles the SD; variance = SD², so it becomes 2² = 4 times as large.'}
]},
{id:'bayes',title:'Diagnostic Tests and Conditional Probability',domain:'Probability / Medicine',text:`<p>The quality of a medical test is described by two figures. <b>Sensitivity</b> is the probability that the test is positive when a person has the disease. <b>Specificity</b> is the probability that the test is negative when a person is healthy. The share of the population that has the disease is called <b>prevalence</b>.</p><p>What matters to a patient with a positive result is the <b>positive predictive value</b> (PPV): the probability of actually being ill given a positive test. It can be found by imagining a large group of people and counting:</p><p style="text-align:center">PPV = true positives ÷ (true positives + false positives)</p><p>Consider a disease with a prevalence of 1 %. A screening test has a sensitivity of 90 % and a specificity of 91 %. Imagine 10,000 people are screened.</p>`,
qs:[
{q:'How many of the 10,000 people are ill and test positive (true positives)?',o:['9','90','100','900'],a:1,e:'1 % of 10,000 = 100 ill; 90 % of 100 = 90.'},
{q:'How many healthy people test positive (false positives)?',o:['about 90','about 891','about 900','about 9,009'],a:1,e:'9,900 healthy; specificity 91 % ⇒ 9 % false positives; 9 % of 9,900 = 891.'},
{q:'Approximately how large is the positive predictive value?',o:['about 9 %','about 50 %','about 90 %','about 91 %'],a:0,e:'90 ÷ (90 + 891) = 90 ÷ 981 ≈ 9 %.'},
{q:'The same test is used in a clinic where 20 % of patients have the disease. How does the PPV change?',o:['It stays the same, because sensitivity and specificity are unchanged.','It increases.','It decreases.','It becomes exactly 90 %.'],a:1,e:'With higher prevalence, true positives rise and false positives fall relative to each other, so the PPV increases.'},
{q:'What is the probability that an ill person receives a negative result?',o:['1 %','9 %','10 %','91 %'],a:2,e:'1 − sensitivity = 1 − 0.90 = 10 % (false-negative rate).'},
{q:'A healthy person is tested twice; the results are independent. What is the probability that both tests are (falsely) positive?',o:['about 0.8 %','about 9 %','about 18 %','about 81 %'],a:0,e:'0.09 × 0.09 = 0.0081 ≈ 0.8 %.'}
]},
{id:'growth',title:'Exponential Growth and Decay',domain:'Mathematics / Biology',text:`<p>A quantity grows <b>exponentially</b> when it increases by the same factor in equal time intervals. For a bacterial culture with initial count N<sub>0</sub> and doubling time T:</p><p style="text-align:center">N(t) = N<sub>0</sub> · 2<sup>t/T</sup></p><p>Decay works the same way with a <b>half-life</b> T<sub>½</sub>: after each half-life only half of the quantity remains.</p><p>For growth at a constant rate of p percent per period, the doubling time can be estimated with the <b>rule of 70</b>: doubling time ≈ 70 ÷ p periods.</p><p>Logarithms are the inverse of exponentiation: log<sub>b</sub>(x) = y means b<sup>y</sup> = x. For example, log<sub>2</sub>(8) = 3. If the vertical axis of a graph is logarithmic, exponential growth appears as a straight line.</p>`,
qs:[
{q:'A culture starts with 500 bacteria and doubles every 20 minutes. How many bacteria are there after one hour?',o:['1,500','2,000','3,000','4,000'],a:3,e:'60 min = 3 doublings: 500 · 2³ = 4,000.'},
{q:'An economy grows by 7 % per year. After roughly how many years has it doubled?',o:['about 5 years','about 7 years','about 10 years','about 14 years'],a:2,e:'Rule of 70: 70 ÷ 7 = 10.'},
{q:'A culture doubles every 3 hours. After about how long has it grown roughly 1,000-fold?',o:['about 10 hours','about 30 hours','about 300 hours','about 3,000 hours'],a:1,e:'2¹⁰ = 1,024 ≈ 1,000 ⇒ 10 doublings × 3 h = 30 h.'},
{q:'What is log₂(32) + log₁₀(100)?',o:['5','7','10','132'],a:1,e:'log₂(32) = 5 and log₁₀(100) = 2; 5 + 2 = 7.'},
{q:'A sample contains 80 g of a substance with a half-life of 5 years. How much remains after 15 years?',o:['5 g','10 g','20 g','26.7 g'],a:1,e:'15 years = 3 half-lives: 80 → 40 → 20 → 10 g.'},
{q:'A process is plotted with a logarithmic vertical axis and a linear time axis. The curve is a rising straight line. What does this indicate?',o:['Linear growth','Exponential growth','Growth that slows down over time','No growth'],a:1,e:'On a log scale, a constant growth factor per time step becomes a constant increase ⇒ straight line.'}
]},
{id:'elasticity',title:'Price Elasticity of Demand',domain:'Economics',text:`<p>The <b>price elasticity of demand</b> (E) measures how strongly the quantity demanded reacts to a change in price:</p><p style="text-align:center">E = (percentage change in quantity) ÷ (percentage change in price)</p><p>Because demand usually falls when prices rise, E is normally negative; economists often compare its absolute value. If |E| &gt; 1, demand is <b>elastic</b>: quantity reacts more than proportionally, so a price increase <i>reduces</i> revenue (price × quantity). If |E| &lt; 1, demand is <b>inelastic</b> and a price increase <i>raises</i> revenue. A perfectly inelastic demand (E = 0) does not react to price at all.</p><p>Demand tends to be inelastic for necessities with few substitutes and elastic for goods with many close substitutes or luxury goods. The <b>cross-price elasticity</b> relates the change in demand for one good to a price change of another; it is positive for substitutes and negative for complements.</p>`,
qs:[
{q:'The price of a good rises by 10 % and the quantity demanded falls by 20 %. What is the price elasticity?',o:['−0.5 (inelastic)','−1 (unit elastic)','−2 (elastic)','−20 (elastic)'],a:2,e:'−20 % ÷ 10 % = −2; |E| > 1 ⇒ elastic.'},
{q:'Demand for a product is elastic. The firm lowers its price. What happens to revenue?',o:['It rises.','It falls.','It stays the same.','It cannot be determined from elasticity.'],a:0,e:'Elastic: quantity rises proportionally more than the price falls ⇒ revenue rises.'},
{q:'A cinema raises its ticket price from €50 to €55; weekly sales fall from 1,000 to 950 tickets. How does weekly revenue change?',o:['It falls by €2,250.','It stays at €50,000.','It rises by €2,250.','It rises by €5,000.'],a:2,e:'Before: 50 × 1,000 = 50,000. After: 55 × 950 = 52,250. Change = +2,250 (E = −5 % ÷ 10 % = −0.5, inelastic).'},
{q:'For which good is demand most likely to be inelastic?',o:['A particular brand of chocolate','Package holidays abroad','A life-saving prescription drug','A specific model of sports car'],a:2,e:'Necessity with few substitutes ⇒ inelastic.'},
{q:'How is perfectly inelastic demand shown in a price–quantity diagram (price on the vertical axis)?',o:['As a horizontal line','As a vertical line','As a downward-sloping 45° line','As an upward-sloping line'],a:1,e:'Quantity is the same at every price ⇒ vertical line.'},
{q:'When the price of tea rises, demand for coffee increases. What does this imply?',o:['Cross-price elasticity is negative; the goods are complements.','Cross-price elasticity is positive; the goods are substitutes.','Coffee demand is perfectly inelastic.','Tea demand is elastic.'],a:1,e:'Price of one ↑, demand for the other ↑ ⇒ positive cross elasticity ⇒ substitutes.'}
]},
{id:'npv',title:'Time Value of Money',domain:'Finance / Business',text:`<p>Money available today is worth more than the same amount in the future because it can earn interest. With an interest rate r per year and compound interest, a present value PV grows in n years to the <b>future value</b></p><p style="text-align:center">FV = PV · (1 + r)<sup>n</sup></p><p>Conversely, a future payment is <b>discounted</b> to today: PV = FV ÷ (1 + r)<sup>n</sup>. With <b>simple interest</b>, interest is only paid on the original amount: FV = PV · (1 + r·n).</p><p>Investment decisions are often based on the <b>net present value</b> (NPV): all future cash flows are discounted to today and the initial investment I<sub>0</sub> is subtracted:</p><p style="text-align:center">NPV = −I<sub>0</sub> + CF<sub>1</sub>/(1+r) + CF<sub>2</sub>/(1+r)² + …</p><p>A project with a positive NPV earns more than the required rate r. The rate at which NPV equals zero is called the <b>internal rate of return</b> (IRR).</p>`,
qs:[
{q:'€1,000 is invested at 10 % compound interest for 2 years. What is the future value?',o:['€1,100','€1,200','€1,210','€1,331'],a:2,e:'1,000 · 1.1² = 1,000 · 1.21 = 1,210.'},
{q:'What is the present value of €1,210 paid in 2 years at a rate of 10 %?',o:['€968','€1,000','€1,089','€1,100'],a:1,e:'1,210 ÷ 1.21 = 1,000.'},
{q:'A project costs €1,000 today and pays €550 after one year and €605 after two years. With r = 10 %, what is the NPV?',o:['−€155','€0','€155','€1,155'],a:1,e:'550/1.1 = 500; 605/1.21 = 500; NPV = −1,000 + 500 + 500 = 0.'},
{q:'The required rate of return for a project with only positive future cash flows increases. What happens to its NPV?',o:['It increases.','It decreases.','It is unchanged.','It becomes exactly zero.'],a:1,e:'Higher discount rate ⇒ future cash flows are worth less today ⇒ NPV falls.'},
{q:'€1,000 is invested for 3 years at 10 %. By how much does the compound-interest result exceed the simple-interest result?',o:['€0','€10','€31','€331'],a:2,e:'Compound: 1,000 · 1.1³ = 1,331. Simple: 1,000 · 1.3 = 1,300. Difference = 31.'},
{q:'What does an NPV of exactly zero at a rate of 8 % mean?',o:['The project loses 8 % per year.','The project\'s internal rate of return is 8 %.','The project pays back no money.','The project should always be rejected.'],a:1,e:'By definition, IRR is the rate where NPV = 0.'}
]},
{id:'ohm',title:'Simple Electric Circuits',domain:'Physics / Engineering',text:`<p>In a simple circuit, the voltage U (volts, V), current I (amperes, A) and resistance R (ohms, Ω) are linked by <b>Ohm's law</b>: U = R · I.</p><p>For resistors connected <b>in series</b>, the same current flows through all of them and the total resistance is the sum: R = R<sub>1</sub> + R<sub>2</sub> + …. The voltage divides in proportion to the resistances.</p><p>For resistors connected <b>in parallel</b>, all have the same voltage and the currents add up. The total resistance follows 1/R = 1/R<sub>1</sub> + 1/R<sub>2</sub> + …, so it is always smaller than the smallest individual resistance.</p><p>The electrical <b>power</b> is P = U · I (watts, W). Using Ohm's law it can also be written as P = I² · R or P = U² / R.</p>`,
qs:[
{q:'A voltage of 12 V is applied to a 4 Ω resistor. What current flows?',o:['0.33 A','3 A','16 A','48 A'],a:1,e:'I = U/R = 12/4 = 3 A.'},
{q:'Resistors of 2 Ω and 4 Ω are connected in series to 12 V. What is the voltage across the 4 Ω resistor?',o:['4 V','6 V','8 V','12 V'],a:2,e:'R = 6 Ω ⇒ I = 2 A; U₄ = 4 · 2 = 8 V.'},
{q:'What is the total resistance of 6 Ω and 3 Ω connected in parallel?',o:['2 Ω','4.5 Ω','9 Ω','18 Ω'],a:0,e:'1/R = 1/6 + 1/3 = 3/6 ⇒ R = 2 Ω.'},
{q:'A device draws 3 A from a 12 V source. What is its power?',o:['4 W','15 W','36 W','144 W'],a:2,e:'P = U · I = 12 · 3 = 36 W.'},
{q:'A second identical lamp is connected in parallel to a lamp on a fixed-voltage source. What happens to the total current drawn from the source?',o:['It halves.','It stays the same.','It doubles.','It quadruples.'],a:2,e:'Each lamp has the same voltage and draws the same current; currents add ⇒ total doubles.'},
{q:'The voltage stays constant while the resistance of a heater is doubled. What happens to the heating power?',o:['It doubles.','It halves.','It quadruples.','It stays the same.'],a:1,e:'P = U²/R: doubling R halves P.'}
]},
{id:'kinematics',title:'Motion with Constant Acceleration',domain:'Physics',text:`<p>For motion that starts from rest with constant acceleration a, the velocity and distance after time t are:</p><p style="text-align:center">v = a · t &nbsp;&nbsp;&nbsp;&nbsp; s = ½ · a · t²</p><p>Combining both gives v² = 2 · a · s. For motion at constant velocity, s = v · t.</p><p>Objects falling freely near the Earth's surface (air resistance neglected) accelerate with g ≈ 10 m/s², regardless of their mass.</p><p>The same equations describe braking: a vehicle with speed v that decelerates at a constant rate a needs the braking distance s = v² / (2a). Speeds are converted with 1 m/s = 3.6 km/h.</p>`,
qs:[
{q:'A car starts from rest and accelerates at 2 m/s² for 5 s. What is its speed?',o:['2.5 m/s','7 m/s','10 m/s','25 m/s'],a:2,e:'v = a·t = 2 · 5 = 10 m/s.'},
{q:'How far does the car travel in these 5 seconds?',o:['10 m','25 m','50 m','100 m'],a:1,e:'s = ½ · 2 · 5² = 25 m.'},
{q:'A stone is dropped from a height of 45 m. How long does it take to reach the ground?',o:['2 s','3 s','4.5 s','9 s'],a:1,e:'45 = ½ · 10 · t² ⇒ t² = 9 ⇒ t = 3 s.'},
{q:'With what speed does the stone hit the ground?',o:['15 m/s','30 m/s','45 m/s','90 m/s'],a:1,e:'v = g·t = 10 · 3 = 30 m/s (check: v² = 2·10·45 = 900).'},
{q:'A driver doubles her speed. With the same deceleration, how does the braking distance change?',o:['It stays the same.','It doubles.','It triples.','It quadruples.'],a:3,e:'s = v²/(2a): speed ×2 ⇒ distance ×4.'},
{q:'A heavy and a light ball are dropped simultaneously from the same height in a vacuum. Which statement is correct?',o:['The heavy ball lands first.','The light ball lands first.','Both land at the same time.','It depends on the height.'],a:2,e:'Free-fall acceleration does not depend on mass.'}
]},
{id:'gas',title:'The Ideal Gas Law',domain:'Physics / Chemistry',text:`<p>For an ideal gas, pressure p, volume V, amount of substance n and absolute temperature T are related by</p><p style="text-align:center">p · V = n · R · T</p><p>where R is the universal gas constant. Temperatures must be given in kelvin: T[K] = θ[°C] + 273 (rounded).</p><p>Special cases follow when some quantities are held constant. At constant temperature (<b>Boyle–Mariotte</b>), p · V is constant. At constant pressure (<b>Charles</b>), V is proportional to T. At constant volume (<b>Gay-Lussac</b>), p is proportional to T.</p>`,
qs:[
{q:'At constant temperature, the pressure on a gas is doubled. What happens to its volume?',o:['It doubles.','It halves.','It quadruples.','It stays the same.'],a:1,e:'p·V constant ⇒ p ×2 ⇒ V ÷2.'},
{q:'A sealed, rigid container is heated from 300 K to 600 K. What happens to the pressure?',o:['It halves.','It stays the same.','It doubles.','It increases by 300 %.'],a:2,e:'Constant V: p ∝ T; T doubles ⇒ p doubles (an increase of 100 %).'},
{q:'What is 27 °C in kelvin (rounded)?',o:['−246 K','27 K','246 K','300 K'],a:3,e:'27 + 273 = 300 K.'},
{q:'At constant pressure, 2 litres of gas at 300 K are heated to 450 K. What is the new volume?',o:['1.33 L','3 L','4 L','4.5 L'],a:1,e:'V ∝ T: 2 · 450/300 = 3 L.'},
{q:'A gas is heated at constant volume from 10 °C to 20 °C. Which statement is correct?',o:['The pressure doubles.','The pressure rises by about 3.5 %.','The pressure halves.','The pressure is unchanged.'],a:1,e:'Use kelvin: 283 K → 293 K; ratio ≈ 1.035. Doubling °C is not doubling T.'},
{q:'At constant temperature and volume, twice as many gas molecules are pumped into a container. What happens to the pressure?',o:['It doubles.','It halves.','It stays the same.','It quadruples.'],a:0,e:'p = nRT/V ⇒ p ∝ n.'}
]},
{id:'ph',title:'Acids, Bases and the pH Scale',domain:'Chemistry',text:`<p>The acidity of an aqueous solution is expressed by its <b>pH value</b>, defined as the negative decimal logarithm of the hydrogen-ion concentration (in mol/L):</p><p style="text-align:center">pH = −log<sub>10</sub>[H<sup>+</sup>]</p><p>A decrease of one pH unit therefore means a tenfold increase in [H<sup>+</sup>]. At 25 °C, pure water has pH 7 (neutral); solutions with pH &lt; 7 are acidic, those with pH &gt; 7 basic. The analogous quantity for hydroxide ions is pOH, and at 25 °C: pH + pOH = 14.</p><p>When an acid reacts with a base, a salt and water are formed (<b>neutralisation</b>). Diluting a strong acid with water lowers [H<sup>+</sup>] and raises the pH toward 7.</p>`,
qs:[
{q:'A solution has [H⁺] = 10⁻³ mol/L. What is its pH?',o:['−3','0.001','3','11'],a:2,e:'pH = −log(10⁻³) = 3.'},
{q:'How many times higher is [H⁺] at pH 2 than at pH 5?',o:['3 times','30 times','100 times','1,000 times'],a:3,e:'Difference of 3 units ⇒ 10³ = 1,000.'},
{q:'A strong acid with pH 2 is diluted tenfold with water. What is the new pH (approximately)?',o:['1','2','3','20'],a:2,e:'[H⁺] ÷ 10 ⇒ pH + 1 = 3.'},
{q:'A solution has pH 9 at 25 °C. Which statement is correct?',o:['It is acidic.','It is neutral.','It is basic.','Its pOH is 9.'],a:2,e:'pH > 7 ⇒ basic; pOH = 14 − 9 = 5.'},
{q:'What is the pOH of a solution with pH 4 at 25 °C?',o:['4','7','10','14'],a:2,e:'pOH = 14 − 4 = 10.'},
{q:'What are the products of a neutralisation reaction?',o:['An acid and a base','A salt and water','Hydrogen and oxygen','Only water'],a:1,e:'Acid + base → salt + water.'}
]},
{id:'enzyme',title:'Enzyme Kinetics',domain:'Biology / Biochemistry',text:`<p>Enzymes speed up chemical reactions. The reaction rate v depends on the substrate concentration [S] as described by the <b>Michaelis–Menten equation</b>:</p><p style="text-align:center">v = V<sub>max</sub> · [S] ÷ (K<sub>m</sub> + [S])</p><p>V<sub>max</sub> is the maximum rate reached when all enzyme molecules are saturated with substrate. The <b>Michaelis constant</b> K<sub>m</sub> is the substrate concentration at which the rate is half of V<sub>max</sub>. A small K<sub>m</sub> means that the enzyme reaches half its maximum rate already at low substrate concentrations — it has a high <b>affinity</b> for its substrate.</p><p>A <b>competitive inhibitor</b> resembles the substrate and competes for the active site. It raises the apparent K<sub>m</sub>, but at very high substrate concentrations it is outcompeted, so V<sub>max</sub> is unchanged.</p>`,
qs:[
{q:'What is the reaction rate when [S] equals Kₘ?',o:['0','Vmax/4','Vmax/2','Vmax'],a:2,e:'v = Vmax·Kₘ/(2Kₘ) = Vmax/2.'},
{q:'Vmax = 100 units, Kₘ = 2 mM, [S] = 6 mM. What is v?',o:['25 units','50 units','75 units','300 units'],a:2,e:'v = 100 · 6/(2 + 6) = 600/8 = 75.'},
{q:'What happens to v when [S] becomes very much larger than Kₘ?',o:['v approaches 0.','v approaches Vmax.','v increases without limit.','v equals Kₘ.'],a:1,e:'Kₘ + [S] ≈ [S] ⇒ v ≈ Vmax (saturation).'},
{q:'Enzyme X has Kₘ = 0.1 mM, enzyme Y has Kₘ = 5 mM for the same substrate. Which statement is correct?',o:['X has the higher affinity.','Y has the higher affinity.','Both have the same affinity.','X must have the higher Vmax.'],a:0,e:'Smaller Kₘ ⇒ higher affinity. Kₘ says nothing about Vmax.'},
{q:'How does a competitive inhibitor change the kinetic parameters?',o:['Kₘ ↑, Vmax unchanged','Kₘ unchanged, Vmax ↓','Kₘ ↓, Vmax ↓','Both unchanged'],a:0,e:'Stated in the text: apparent Kₘ rises, Vmax is unchanged.'},
{q:'At substrate concentrations far below Kₘ, how does v depend on [S]?',o:['v is constant.','v is roughly proportional to [S].','v decreases as [S] increases.','v is proportional to [S]².'],a:1,e:'Kₘ + [S] ≈ Kₘ ⇒ v ≈ (Vmax/Kₘ)·[S], a linear relation.'}
]},
{id:'bigo',title:'Efficiency of Algorithms',domain:'Computer Science',text:`<p>The efficiency of an algorithm is described with <b>Big-O notation</b>, which states how the number of steps grows with the input size n, ignoring constant factors.</p><table><tr><th>Class</th><th>Example</th></tr><tr><td>O(log n)</td><td>Binary search in a <i>sorted</i> list: each comparison halves the remaining search range.</td></tr><tr><td>O(n)</td><td>Linear search: check the elements one after another.</td></tr><tr><td>O(n log n)</td><td>Efficient sorting (e.g. merge sort).</td></tr><tr><td>O(n²)</td><td>Simple sorting (e.g. bubble sort); two nested loops over the input.</td></tr><tr><td>O(2ⁿ)</td><td>Trying all subsets of a set.</td></tr></table><p>For an O(n²) algorithm, tripling n multiplies the running time by about 3² = 9.</p>`,
qs:[
{q:'About how many comparisons does binary search need in the worst case for a sorted list of 1,024 elements?',o:['about 10','about 32','about 512','about 1,024'],a:0,e:'2¹⁰ = 1,024 ⇒ about log₂(1,024) = 10 halvings.'},
{q:'Which requirement must be met for binary search to work?',o:['The list must contain only numbers.','The list must be sorted.','The list must have an even length.','The list must not contain duplicates.'],a:1,e:'Halving only works if the order tells you which half to discard.'},
{q:'An O(n²) algorithm needs 2 seconds for n = 1,000. About how long does it need for n = 3,000?',o:['6 s','9 s','18 s','54 s'],a:2,e:'3² = 9 times longer: 2 · 9 = 18 s.'},
{q:'Which complexity class grows fastest for large n?',o:['O(n²)','O(n log n)','O(2ⁿ)','O(n)'],a:2,e:'Exponential growth outpaces any polynomial.'},
{q:'Linear search is run on an unsorted list of 500 elements and the item is not in the list. How many comparisons are made?',o:['1','9','250','500'],a:3,e:'Every element must be checked before concluding it is absent.'},
{q:'Two nested loops each run from 1 to n and perform one operation per inner step. How many operations are performed for n = 20?',o:['40','200','400','2²⁰'],a:2,e:'n · n = 20 · 20 = 400.'}
]},
{id:'binary',title:'Number Systems and Logic Operations',domain:'Computer Science / Engineering',text:`<p>Computers represent numbers in the <b>binary</b> system (base 2). Each position has a place value that is a power of 2: from right to left 1, 2, 4, 8, 16, …. For example, 1101₂ = 8 + 4 + 0 + 1 = 13. The <b>hexadecimal</b> system (base 16) uses the digits 0–9 and A–F (A = 10 … F = 15); each hex digit corresponds to four binary digits (bits).</p><p>Bitwise logic operations compare two numbers position by position:</p><table><tr><th>Operation</th><th>Result bit is 1 if …</th></tr><tr><td>AND</td><td>both bits are 1</td></tr><tr><td>OR</td><td>at least one bit is 1</td></tr><tr><td>XOR</td><td>exactly one bit is 1</td></tr></table><p>With k bits, 2<sup>k</sup> different values can be represented.</p>`,
qs:[
{q:'What is the decimal value of 1011₂?',o:['9','11','13','1011'],a:1,e:'8 + 0 + 2 + 1 = 11.'},
{q:'What is 26 in binary?',o:['10110','11001','11010','11100'],a:2,e:'26 = 16 + 8 + 2 ⇒ 11010.'},
{q:'What is the decimal value of the hexadecimal number 2F?',o:['29','31','47','215'],a:2,e:'2 · 16 + 15 = 47.'},
{q:'What is 1100 AND 1010?',o:['1000','1110','0110','0010'],a:0,e:'Only the leftmost position has 1 in both.'},
{q:'What is 1100 XOR 1010?',o:['1000','1110','0110','0001'],a:2,e:'Positions differ at the 2nd and 3rd bit ⇒ 0110.'},
{q:'How many different values can be stored in one byte (8 bits)?',o:['8','16','128','256'],a:3,e:'2⁸ = 256.'}
]},
{id:'survey',title:'Sampling and Bias in Social Research',domain:'Social Sciences',text:`<p>Surveys rarely question an entire population; instead they use a <b>sample</b>. In a <b>simple random sample</b>, every member of the population has the same chance of being selected. In a <b>stratified sample</b>, the population is first divided into groups (strata, e.g. age groups) and random samples are drawn from each group.</p><p>Results can be distorted by <b>bias</b>. <i>Selection bias</i> occurs when the sample systematically differs from the population, for example when participants choose themselves (self-selection). <i>Non-response bias</i> occurs when those who do not answer differ from those who do. <i>Response bias</i> can be caused by leading question wording.</p><p>The random sampling error shrinks with sample size n: the <b>margin of error</b> is roughly proportional to 1/√n. A measurement is <b>reliable</b> if it gives consistent results when repeated and <b>valid</b> if it measures what it is supposed to measure. Finally, a correlation between two variables does not prove causation; a third variable (a <b>confounder</b>) may influence both.</p>`,
qs:[
{q:'A news website asks its visitors to vote in an online poll on a political issue. Which problem is most likely?',o:['Non-response bias only','Self-selection bias','Stratification error','No bias, since many people vote'],a:1,e:'Participants choose themselves and are not representative of the population.'},
{q:'A researcher wants to halve the margin of error of a survey. By what factor must the sample size increase?',o:['2','4','8','It cannot be reduced.'],a:1,e:'Error ∝ 1/√n: to halve it, √n must double ⇒ n × 4.'},
{q:'Which procedure describes a stratified sample?',o:['Asking the first 100 people who pass by','Dividing the population into age groups and drawing randomly from each group','Asking participants to recruit their friends','Surveying only volunteers'],a:1,e:'Groups (strata) first, then random selection within each.'},
{q:'The question "Don\'t you agree that the new park is a waste of money?" mainly risks which distortion?',o:['Response bias caused by leading wording','Non-response bias','Sampling error','Low reliability of the scale'],a:0,e:'The wording pushes respondents toward a particular answer.'},
{q:'Ice-cream sales and drowning accidents are positively correlated. What is the best explanation?',o:['Eating ice cream causes drowning.','Drowning accidents increase ice-cream sales.','A third variable such as hot weather influences both.','The correlation must be a calculation error.'],a:2,e:'A confounder (summer temperature) drives both.'},
{q:'A bathroom scale always shows exactly 2 kg too much. How can it be described?',o:['Valid and reliable','Reliable but not valid','Valid but not reliable','Neither valid nor reliable'],a:1,e:'Consistent results (reliable) but systematically wrong (not valid).'}
]},
{id:'game',title:'Strategic Decisions: Game Theory',domain:'Economics',text:`<p>Game theory analyses situations in which the outcome for each participant depends on the decisions of others. A <b>dominant strategy</b> is one that yields a higher payoff than any alternative, whatever the other player does. A <b>Nash equilibrium</b> is a combination of strategies in which no player can improve by changing only their own strategy. An outcome is <b>Pareto-efficient</b> if no player can be made better off without making another worse off.</p><p>Two firms, A and B, each decide whether to set a <i>High</i> or <i>Low</i> price. The table shows annual profits in € million as (A, B):</p><table><tr><th></th><th>B: High</th><th>B: Low</th></tr><tr><th>A: High</th><td>(10, 10)</td><td>(2, 12)</td></tr><tr><th>A: Low</th><td>(12, 2)</td><td>(4, 4)</td></tr></table><p>If the game is repeated many times, firms may be able to sustain cooperation, e.g. by the <i>tit-for-tat</i> strategy (copy the opponent's previous move).</p>`,
qs:[
{q:'Does firm A have a dominant strategy?',o:['Yes, High','Yes, Low','No','Only if B chooses High'],a:1,e:'If B High: Low 12 > High 10. If B Low: Low 4 > High 2 ⇒ Low is always better.'},
{q:'Which combination is the Nash equilibrium?',o:['(High, High)','(High, Low)','(Low, High)','(Low, Low)'],a:3,e:'Both have Low as dominant strategy; neither gains by switching alone from (Low, Low).'},
{q:'Which outcome makes both firms better off than the equilibrium?',o:['(High, High)','(High, Low)','(Low, High)','None'],a:0,e:'(10, 10) beats (4, 4) for both.'},
{q:'What is the combined profit of both firms in the equilibrium?',o:['€8 million','€14 million','€20 million','€24 million'],a:0,e:'4 + 4 = 8.'},
{q:'Why can repeated interaction help the firms reach (High, High)?',o:['Because payoffs increase each round','Because a deviation today can be punished in later rounds','Because dominant strategies disappear','Because firms are forced by law to cooperate'],a:1,e:'Future retaliation (e.g. tit-for-tat) makes deviating less attractive.'},
{q:'Suppose the payoff for (Low, Low) changes to (1, 1); everything else stays the same. Which statement is correct?',o:['Low is still dominant for A.','High is now dominant for A.','A no longer has a dominant strategy.','(Low, Low) remains the only Nash equilibrium.'],a:2,e:'If B High: A prefers Low (12 > 10). If B Low: A prefers High (2 > 1). Best reply depends on B ⇒ no dominant strategy.'}
]},
{id:'regression',title:'Correlation and Linear Regression',domain:'Statistics / Social Sciences',text:`<p>The <b>correlation coefficient</b> r measures the strength and direction of a linear relationship between two variables. It lies between −1 and +1: values near ±1 indicate a strong linear relationship, values near 0 a weak one. In simple linear regression, the <b>coefficient of determination</b> R² = r² gives the share of the variance in y that is explained by x.</p><p>A <b>regression line</b> ŷ = a + b·x predicts y from x. The slope b states by how much y changes on average when x increases by one unit; the intercept a is the predicted value for x = 0. Predictions far outside the range of the observed data (<b>extrapolation</b>) are unreliable.</p><p>A study of students found the following relation between weekly study hours (x, observed range 0–15 h) and exam score (y, maximum 100 points):</p><p style="text-align:center">ŷ = 40 + 5·x, &nbsp;&nbsp; r = 0.8</p>`,
qs:[
{q:'What score does the model predict for a student who studies 6 hours per week?',o:['46','60','70','300'],a:2,e:'40 + 5 · 6 = 70.'},
{q:'How is the slope of 5 interpreted?',o:['Students study 5 hours on average.','Each additional study hour is associated with 5 more points on average.','5 % of the variance is explained.','The minimum score is 5.'],a:1,e:'Slope = average change in y per unit of x.'},
{q:'What share of the variance in exam scores is explained by study time?',o:['8 %','40 %','64 %','80 %'],a:2,e:'R² = 0.8² = 0.64.'},
{q:'Why is it problematic to use the model for a student who studies 30 hours?',o:['The predicted score of 190 is impossible; this is an extrapolation beyond the data.','Because r is below 1.','Because the intercept is 40.','There is no problem.'],a:0,e:'30 h is outside the observed 0–15 h range, and 40 + 150 = 190 exceeds the maximum of 100.'},
{q:'In another study, r = −0.9. What does this mean?',o:['A weak negative relationship','A strong negative linear relationship','No relationship','A strong positive relationship'],a:1,e:'Magnitude 0.9 = strong; sign negative.'},
{q:'All exam scores are raised by 10 bonus points. How does the regression line change?',o:['Slope +10','Intercept +10, slope unchanged','Both unchanged','r increases'],a:1,e:'Shifting all y-values moves the line up without changing its slope (r unchanged too).'}
]},
{id:'market',title:'Market Equilibrium',domain:'Economics',text:`<p>In a competitive market, the <b>equilibrium price</b> is the price at which the quantity demanded equals the quantity supplied. For a certain product, demand and supply (quantity Q in thousand units, price P in €) are:</p><p style="text-align:center">Demand: Q<sub>d</sub> = 100 − 2P &nbsp;&nbsp;&nbsp;&nbsp; Supply: Q<sub>s</sub> = 20 + 2P</p><p>A government can intervene in the market. A <b>maximum price</b> (price ceiling) set below the equilibrium price leads to excess demand (shortage). A <b>minimum price</b> (price floor) set above the equilibrium price leads to excess supply (surplus). A <b>tax</b> levied on producers raises their costs, which shifts the supply curve to the left (upwards).</p><p>If consumers want to buy more at every price (e.g. because incomes rise), the demand curve shifts to the right.</p>`,
qs:[
{q:'What is the equilibrium price?',o:['€15','€20','€25','€40'],a:1,e:'100 − 2P = 20 + 2P ⇒ 80 = 4P ⇒ P = 20.'},
{q:'What is the equilibrium quantity?',o:['40 thousand','50 thousand','60 thousand','80 thousand'],a:2,e:'Q = 100 − 2 · 20 = 60.'},
{q:'The government sets a maximum price of €15. What is the result?',o:['A surplus of 20 thousand units','A shortage of 20 thousand units','A shortage of 10 thousand units','No effect'],a:1,e:'Qd = 70, Qs = 50 ⇒ excess demand 20.'},
{q:'A tax on producers is introduced. What happens (ceteris paribus)?',o:['Price falls, quantity rises.','Price rises, quantity falls.','Price and quantity both rise.','Nothing changes.'],a:1,e:'Supply shifts left ⇒ higher price, lower quantity.'},
{q:'A minimum price is set at €30. What is the consequence?',o:['Shortage','Surplus','Equilibrium','The minimum price has no effect'],a:1,e:'Above equilibrium: Qs = 80 > Qd = 40 ⇒ surplus of 40.'},
{q:'Demand changes to Qd = 120 − 2P. What is the new equilibrium?',o:['P = 20, Q = 60','P = 25, Q = 70','P = 30, Q = 60','P = 25, Q = 80'],a:1,e:'120 − 2P = 20 + 2P ⇒ P = 25; Q = 20 + 50 = 70.'}
]},
{id:'breakeven',title:'Break-Even Analysis',domain:'Business Administration',text:`<p>Costs of a company are split into <b>fixed costs</b> (independent of output, e.g. rent) and <b>variable costs</b> (rising with each unit produced, e.g. material). The <b>contribution margin</b> per unit is the selling price minus the variable cost per unit; it is the amount each unit contributes to covering fixed costs and then to profit.</p><p>The <b>break-even point</b> (BEP) is the output at which total revenue equals total costs, i.e. profit is zero:</p><p style="text-align:center">BEP (units) = fixed costs ÷ contribution margin per unit</p><p>As output increases, fixed costs are spread over more units, so the fixed cost per unit falls (<i>fixed-cost degression</i>).</p><p>A small bakery has monthly fixed costs of €12,000. It sells a cake for €50; the variable cost per cake is €30.</p>`,
qs:[
{q:'What is the contribution margin per cake?',o:['€12','€20','€30','€80'],a:1,e:'50 − 30 = 20.'},
{q:'How many cakes must be sold per month to break even?',o:['240','400','600','1,200'],a:2,e:'12,000 ÷ 20 = 600.'},
{q:'What is the monthly profit when 1,000 cakes are sold?',o:['€8,000','€20,000','€38,000','€50,000'],a:0,e:'1,000 · 20 − 12,000 = 8,000.'},
{q:'The price rises to €60 (costs unchanged). What is the new break-even point?',o:['300 cakes','400 cakes','500 cakes','600 cakes'],a:1,e:'Margin = 30; 12,000 ÷ 30 = 400.'},
{q:'At a price of €50, how many cakes are needed for a profit of €4,000?',o:['700','800','900','1,000'],a:1,e:'(12,000 + 4,000) ÷ 20 = 800.'},
{q:'What happens to the fixed cost per cake when output increases from 600 to 1,200 cakes?',o:['It doubles from €20 to €40.','It halves from €20 to €10.','It stays at €20.','It becomes zero.'],a:1,e:'12,000/600 = 20; 12,000/1,200 = 10.'}
]},
{id:'heat',title:'Heat and Temperature',domain:'Physics / Engineering',text:`<p>The heat Q required to change the temperature of a body by ΔT is</p><p style="text-align:center">Q = m · c · ΔT</p><p>where m is the mass and c the <b>specific heat capacity</b> of the material. For water, c ≈ 4.2 kJ/(kg·K). A temperature difference of 1 K equals a difference of 1 °C. Materials with a lower specific heat capacity heat up faster when the same amount of energy is supplied.</p><p>When two amounts of the same liquid with different temperatures are mixed (no heat losses), the mixing temperature is the <b>mass-weighted mean</b>: T<sub>mix</sub> = (m<sub>1</sub>T<sub>1</sub> + m<sub>2</sub>T<sub>2</sub>) ÷ (m<sub>1</sub> + m<sub>2</sub>).</p><p>Power is energy per time: P = Q ÷ t, where 1 W = 1 J/s and 1 kW = 1 kJ/s.</p>`,
qs:[
{q:'How much heat is needed to warm 2 kg of water by 10 K?',o:['8.4 kJ','42 kJ','84 kJ','840 kJ'],a:2,e:'2 · 4.2 · 10 = 84 kJ.'},
{q:'1 kg of water at 20 °C is mixed with 1 kg of water at 60 °C. What is the mixing temperature?',o:['30 °C','40 °C','50 °C','80 °C'],a:1,e:'Equal masses ⇒ simple average: 40 °C.'},
{q:'3 kg of water at 20 °C are mixed with 1 kg at 60 °C. What is the mixing temperature?',o:['25 °C','30 °C','35 °C','40 °C'],a:1,e:'(3·20 + 1·60) ÷ 4 = 120 ÷ 4 = 30 °C.'},
{q:'A 2 kW kettle runs for 2 minutes without losses. By roughly how much does it warm 1 kg of water?',o:['about 5.7 K','about 29 K','about 57 K','about 240 K'],a:2,e:'Q = 2 kJ/s · 120 s = 240 kJ; ΔT = 240 ÷ 4.2 ≈ 57 K.'},
{q:'Equal masses of water and of oil (c ≈ 2 kJ/(kg·K)) receive the same amount of heat. Which statement is correct?',o:['Both warm by the same amount.','The water warms about twice as much.','The oil warms about twice as much.','The oil does not warm up.'],a:2,e:'ΔT = Q/(m·c): half the c ⇒ about twice the ΔT.'},
{q:'A heater delivers 84 kJ in 42 s. What is its power?',o:['0.5 kW','2 kW','3.5 kW','126 kW'],a:1,e:'84 kJ ÷ 42 s = 2 kJ/s = 2 kW.'}
]}
];
